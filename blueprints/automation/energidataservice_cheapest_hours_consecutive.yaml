blueprint:
  name: Energi Data Service - Cheapest Consecutive Hours
  description: Turn on a device/scene during the X cheapest consecutive hours of the day
  domain: automation
  input:
    price_sensor:
      name: Price Sensor
      description: The energy price sensor from Energi Data Service
      selector:
        entity:
          domain: sensor
          multiple: false
      default: sensor.energi_data_service

    num_hours:
      name: Number of Hours
      description: How many consecutive hours to find (must be in sequence)
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: hours
      default: 4

    action_target:
      name: Action Target
      description: What to turn on/off
      selector:
        entity:
          domain:
            - scene
            - switch
            - light
          multiple: false

    action_type:
      name: Action Type
      description: What action to perform
      selector:
        select:
          options:
            - label: Turn On
              value: turn_on
            - label: Turn Off
              value: turn_off
            - label: Toggle
              value: toggle
      default: turn_on

    time_window_enabled:
      name: Enable Time Window
      description: Only search for cheapest consecutive hours within a specific time window
      selector:
        boolean:
      default: false

    time_window_start:
      name: Time Window Start
      description: Start time for search window (if enabled)
      selector:
        time:
      default: "00:00:00"

    time_window_end:
      name: Time Window End
      description: End time for search window (if enabled)
      selector:
        time:
      default: "23:59:59"

    override_mode:
      name: Override Mode
      description: Override the automatic logic (useful for manual control)
      selector:
        select:
          options:
            - label: Auto (normal logic)
              value: auto
            - label: Force Always On
              value: force_on
            - label: Force Always Off
              value: force_off
      default: auto

    daily_notification:
      name: Daily Schedule Notification
      description: >
        Send a notification at midnight with today's full price schedule,
        showing which hours the device will be ON and OFF.
      selector:
        boolean:
      default: false

variables:
  price_sensor: !input price_sensor
  num_hours: !input num_hours
  action_target: !input action_target
  action_type: !input action_type
  time_window_enabled: !input time_window_enabled
  time_window_start: !input time_window_start
  time_window_end: !input time_window_end
  override_mode: !input override_mode
  daily_notification: !input daily_notification
  inverse_action_type: "{% if action_type == 'turn_on' %}turn_off{% elif action_type == 'turn_off' %}turn_on{% else %}toggle{% endif %}"
  in_cheap_window: >-
    {% set n = num_hours | int %}
    {% set prices = (state_attr(price_sensor, 'raw_today') or [])
                  + (state_attr(price_sensor, 'raw_tomorrow') or [])
                  + (state_attr(price_sensor, 'forecast') or []) %}
    {% set current_hour = now().hour %}
    {% if time_window_enabled | bool %}
      {% set start_hour = strptime(time_window_start, '%H:%M:%S').hour %}
      {% set end_hour = strptime(time_window_end, '%H:%M:%S').hour %}
    {% else %}
      {% set start_hour = 0 %}
      {% set end_hour = 23 %}
    {% endif %}
    {% set result = namespace(found=False) %}
    {% for i in range((prices | length) - n + 1) %}
      {% set ws = prices[i].hour.hour %}
      {% set we = prices[i + n - 1].hour.hour %}
      {% if start_hour <= ws and we <= end_hour %}
        {% set period_ns = namespace(sum=0) %}
        {% for j in range(n) %}
          {% set period_ns.sum = period_ns.sum + prices[i + j].price %}
        {% endfor %}
        {% set min_ns = namespace(sum=999999) %}
        {% for m in range((prices | length) - n + 1) %}
          {% if start_hour <= prices[m].hour.hour and prices[m + n - 1].hour.hour <= end_hour %}
            {% set check_ns = namespace(sum=0) %}
            {% for k in range(n) %}
              {% set check_ns.sum = check_ns.sum + prices[m + k].price %}
            {% endfor %}
            {% if check_ns.sum < min_ns.sum %}
              {% set min_ns.sum = check_ns.sum %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if period_ns.sum == min_ns.sum and ws <= current_hour < we + 1 %}
          {% set result.found = True %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ result.found }}

trigger:
  - platform: time_pattern
    minutes: "0"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ override_mode == 'force_on' }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ action_target }}"
      - conditions:
          - condition: template
            value_template: "{{ override_mode == 'force_off' }}"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ action_target }}"
      - conditions:
          - condition: template
            value_template: "{{ in_cheap_window | bool }}"
        sequence:
          - action: "homeassistant.{{ action_type }}"
            target:
              entity_id: "{{ action_target }}"
    default:
      - action: "homeassistant.{{ inverse_action_type }}"
        target:
          entity_id: "{{ action_target }}"

  - if:
      - condition: template
        value_template: "{{ daily_notification | bool and now().hour == 0 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "eds_consecutive_{{ action_target | replace('.', '_') }}"
          title: >-
            Electricity Schedule — {{ now().strftime('%d %b %Y') }}
          message: >-
            {% set n = num_hours | int %}
            {% set prices = state_attr(price_sensor, 'raw_today') or [] %}
            {% set cheapest_hours = namespace(start=-1, end=-1, min_sum=999999) %}
            {% for i in range((prices | length) - n + 1) %}
              {% set s = namespace(total=0) %}
              {% for j in range(n) %}
                {% set s.total = s.total + prices[i + j].price %}
              {% endfor %}
              {% if s.total < cheapest_hours.min_sum %}
                {% set cheapest_hours.min_sum = s.total %}
                {% set cheapest_hours.start = prices[i].hour.hour %}
                {% set cheapest_hours.end = prices[i + n - 1].hour.hour %}
              {% endif %}
            {% endfor %}
            **{{ action_target }}** · {{ n }} cheapest consecutive hours

            Cheapest window: **{{ '%02d' | format(cheapest_hours.start) }}:00 – {{ '%02d' | format(cheapest_hours.end) }}:00**
            Avg price in window: {{ '%.3f' | format(cheapest_hours.min_sum / n) }} DKK/kWh

            | Hour  | DKK/kWh | Status |
            |-------|---------|--------|
            {% for item in prices | sort(attribute='hour.hour') -%}
            {% set h = item.hour.hour -%}
            | {{ '%02d' | format(h) }}:00 | {{ '%.3f' | format(item.price) }} | {{ '✅ ON' if cheapest_hours.start <= h <= cheapest_hours.end else '⬜ off' }} |
            {% endfor %}
